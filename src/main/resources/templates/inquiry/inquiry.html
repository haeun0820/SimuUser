<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
  <title>문의 - SimuUser</title>
  <link rel="stylesheet" th:href="@{/css/dashboard/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/header/header.css}">
  <link rel="stylesheet" th:href="@{/css/inquiry/inquiry.css}">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root" data-active="inquiry"></div>

  <div class="main-area">
    <header th:replace="header/header :: header('문의')"></header>

    <main class="page-content inquiry-page">
      <section class="inquiry-head">
        <div>
          <h1 class="page-title">문의</h1>
          <p class="inquiry-sub">내가 등록한 문의와 답변 상태를 확인할 수 있습니다.</p>
        </div>
        <button class="btn-new-inquiry" id="openInquiryForm" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          문의하기
        </button>
      </section>

      <section class="inquiry-toolbar">
        <div class="search-wrapper">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="inquirySearchInput" placeholder="제목 또는 내용 검색">
        </div>

        <div class="filter-tabs" aria-label="문의 상태 필터">
          <button class="filter-tab active" type="button" data-filter="all">전체</button>
          <button class="filter-tab" type="button" data-filter="waiting">미답변</button>
          <button class="filter-tab" type="button" data-filter="answered">답변완료</button>
        </div>
      </section>

      <section class="inquiry-card">
        <div class="result-count">내 문의 <span id="inquiryCount">0</span>개</div>

        <div class="inquiry-table-wrap">
          <table class="inquiry-table">
            <thead>
            <tr>
              <th class="col-no">No</th>
              <th class="col-title">제목</th>
              <th class="col-category">유형</th>
              <th class="col-date">등록일시</th>
              <th class="col-status">상태</th>
            </tr>
            </thead>
            <tbody id="inquiryTableBody"></tbody>
          </table>
        </div>

        <div class="empty-state" id="emptyState">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <p>등록된 문의가 없습니다.</p>
          <span>궁금한 점이 생기면 문의하기를 눌러 남겨주세요.</span>
        </div>

        <div class="pagination" id="pagination"></div>
      </section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="inquiryModal" hidden>
  <div class="inquiry-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle">문의하기</h2>
        <p>문의 유형과 내용을 남겨주시면 확인 후 답변드리겠습니다.</p>
      </div>
      <button class="btn-icon" id="closeInquiryForm" type="button" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <form id="inquiryForm" class="inquiry-form">
      <label class="form-group">
        <span class="form-label">문의 유형</span>
        <select class="form-select" id="categoryInput" required>
          <option value="">문의 유형을 선택하세요</option>
          <option value="AI 시뮬레이션">AI 시뮬레이션</option>
          <option value="프로젝트/문서">프로젝트/문서</option>
          <option value="계정/로그인">계정/로그인</option>
          <option value="결제/영수증">결제/영수증</option>
          <option value="기타">기타</option>
        </select>
      </label>

      <label class="form-group">
        <span class="form-label">제목</span>
        <input class="form-input" id="titleInput" type="text" maxlength="80" placeholder="문의 제목을 입력하세요" required>
      </label>

      <label class="form-group">
        <span class="form-label">문의 내용</span>
        <textarea class="form-textarea" id="contentInput" rows="8" placeholder="문제가 발생한 화면, 상황, 요청 사항을 자세히 적어주세요." required></textarea>
      </label>

      <div class="form-actions">
        <button class="btn-cancel" id="cancelInquiryForm" type="button">취소</button>
        <button class="btn-submit" id="submitInquiryBtn" type="submit">등록</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="detailModal" hidden>
  <div class="inquiry-modal detail-modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="modal-header">
      <div>
        <span class="status-badge" id="detailStatus">미답변</span>
        <h2 id="detailTitle"></h2>
        <p id="detailMeta"></p>
      </div>
      <button class="btn-icon" id="closeDetail" type="button" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="detail-body" id="detailContent"></div>
    <div class="answer-box" id="answerBox"></div>
    <div class="detail-actions" id="detailActions">
      <button class="btn-cancel" id="editInquiryBtn" type="button">수정</button>
      <button class="btn-danger" id="deleteInquiryBtn" type="button">삭제</button>
    </div>
  </div>
</div>

<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/header.js}"></script>
<script th:src="@{/js/inquiry/inquiry.js}"></script>
</body>
</html>

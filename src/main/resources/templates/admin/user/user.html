<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 관리 - SimuUser</title>
    <link rel="stylesheet" th:href="@{/css/admin/dashboard/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin/user/user.css}">
</head>
<body>
<div class="app-layout">
    <div class="main-area">
        <header class="top-header" style="height: 60px; justify-content: space-between;">
            <div>
                <div class="dashboard-title" style="font-size: 20px; font-weight: 700;">사용자 관리</div>
                <div class="dashboard-sub" style="font-size: 12px; color: #64748b;">전체 사용자 계정 및 권한 관리</div>
            </div>

            <form class="logout-form" th:action="@{/logout}" method="post">
                <button class="btn-logout" type="submit">로그아웃</button>
            </form>
        </header>

        <main class="page-content" style="overflow-y: auto;">
            <div class="user-toolbar">
                <div class="toolbar-left">
                    <button class="btn-back" onclick="history.back()">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <div class="search-wrapper">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input type="text" id="userSearchInput" placeholder="사용자 검색">
                    </div>
                </div>

                <div class="toolbar-right">
                    <div class="radio-filter-group">
                        <label class="radio-label"><input type="radio" name="loginMethodFilter" value="all" checked><span class="radio-custom"></span> 전체</label>
                        <label class="radio-label"><input type="radio" name="loginMethodFilter" value="google"><span class="radio-custom"></span> 구글</label>
                        <label class="radio-label"><input type="radio" name="loginMethodFilter" value="naver"><span class="radio-custom"></span> 네이버</label>
                        <label class="radio-label"><input type="radio" name="loginMethodFilter" value="kakao"><span class="radio-custom"></span> 카카오</label>
                        <label class="radio-label"><input type="radio" name="loginMethodFilter" value="apple"><span class="radio-custom"></span> 애플</label>
                        <label class="radio-label"><input type="radio" name="loginMethodFilter" value="site"><span class="radio-custom"></span> 일반 ID</label>
                    </div>

                    <button type="button" class="btn-export" onclick="exportUserData()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 6px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        데이터 내보내기
                    </button>
                </div>
            </div>

            <div class="user-card">
                <div class="user-card-header">
                    <h3 class="user-card-title">사용자 목록</h3>
                    <p class="user-card-sub" id="userCountText">총 0명의 사용자</p>
                </div>

                <table class="user-table">
                    <thead>
                    <tr>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>로그인 방식</th>
                        <th>가입일</th>
                        <th>작업</th>
                    </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/admin/user.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 상세 정보 - SimuUser</title>
    <link rel="stylesheet" th:href="@{/css/admin/dashboard/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin/user/user.css}">
    <link rel="stylesheet" th:href="@{/css/admin/user/user_detail.css}">
</head>
<body th:attr="data-user-id=${userId}">
<div class="app-layout">
    <div class="main-area">
        <header class="top-header" style="height: 70px; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0;">
            <div>
                <div class="dashboard-title" style="font-size: 22px; font-weight: 800;">사용자 상세 정보</div>
                <div class="dashboard-sub" style="font-size: 13px; color: #64748b; margin-top: 4px;">회원 상세 정보 및 활동 내역 조회</div>
            </div>

            <form class="logout-form" th:action="@{/logout}" method="post" style="margin: 0;">
                <button class="btn-logout" type="submit">로그아웃</button>
            </form>
        </header>

        <main class="page-content">
            <div class="detail-toolbar">
                <button class="btn-back" onclick="history.back()" title="목록으로 돌아가기">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
            </div>

            <div class="user-profile-card">
                <div class="profile-left">
                    <div class="profile-avatar" id="detailAvatar">-</div>
                    <div class="profile-info">
                        <h3 id="detailName">-</h3>
                        <p id="detailEmail">-</p>
                    </div>
                </div>
                <div class="profile-actions">
                    <button class="btn-danger-outline" type="button" disabled>계정 이용 정지</button>
                </div>
            </div>

            <nav class="admin-tab-nav" style="margin-bottom: 24px;">
                <div class="admin-tab active" onclick="switchDetailTab(this, 'info')">회원정보</div>
                <div class="admin-tab" onclick="switchDetailTab(this, 'projects')">프로젝트</div>
                <div class="admin-tab" onclick="switchDetailTab(this, 'analysis')">분석 현황 및 결과</div>
            </nav>

            <div id="tab-info" class="tab-pane active" style="display: flex; flex-direction: column;">
                <div class="user-info-grid">
                    <div class="info-card">
                        <h4>계정 기본 정보</h4>
                        <div class="info-list">
                            <div class="info-row">
                                <span class="info-label">현재 권한</span>
                                <span class="info-value">
                                    <span class="role-badge role-user" id="detailRoleBadge">-</span>
                                </span>
                            </div>
                            <div class="info-row"><span class="info-label">사용자 ID</span><span class="info-value" id="detailUserId">-</span></div>
                            <div class="info-row"><span class="info-label">가입일시</span><span class="info-value" id="detailCreatedAt">-</span></div>
                            <div class="info-row"><span class="info-label">로그인 방식</span><span class="info-value" id="detailLoginMethod">-</span></div>
                            <div class="info-row"><span class="info-label">계정 상태</span><span class="info-value" id="detailAccountStatus" style="color: var(--success); font-weight: 700;">-</span></div>
                        </div>
                    </div>

                    <div class="info-card">
                        <h4>활동 통계</h4>
                        <div class="info-list">
                            <div class="info-row"><span class="info-label">생성한 프로젝트 수</span><span class="info-value" id="detailProjectCount">0개</span></div>
                            <div class="info-row"><span class="info-label">전체 분석 실행 수</span><span class="info-value" id="detailAnalysisCount">0회</span></div>
                            <div class="info-row"><span class="info-label">문의 등록 수</span><span class="info-value" id="detailInquiryCount">0건</span></div>
                            <div class="info-row"><span class="info-label">최근 활동</span><span class="info-value" id="detailLastActivity">-</span></div>
                        </div>
                    </div>
                </div>
                <footer class="footer"></footer>
            </div>

            <div id="tab-projects" class="tab-pane" style="display: none; flex-direction: column;">
                <div class="info-card" style="width: 100%;">
                    <h4>생성한 프로젝트 목록</h4>
                    <table class="user-table">
                        <thead>
                        <tr>
                            <th>프로젝트명</th>
                            <th>프로젝트 설명</th>
                            <th>상태</th>
                            <th>생성일</th>
                        </tr>
                        </thead>
                        <tbody id="detailProjectsBody"></tbody>
                    </table>
                </div>
                <footer class="footer"></footer>
            </div>

            <div id="tab-analysis" class="tab-pane" style="display: none; flex-direction: column; gap: 24px;">
                <div class="info-card" style="width: 100%;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">
                        <h4 style="margin: 0; border: none; padding: 0;">분석 도구별 실행 추이</h4>
                        <span style="font-size: 12px; color: var(--text-sub);">최근 6개월 기준</span>
                    </div>
                    <div class="growth-chart-wrap" style="height: 350px; position: relative;">
                        <canvas id="userAnalysisChart"></canvas>
                    </div>
                </div>

                <div class="info-card" style="width: 100%;">
                    <h4>최근 분석 결과 이력</h4>
                    <table class="user-table">
                        <thead>
                        <tr>
                            <th>분석 도구</th>
                            <th>대상 프로젝트</th>
                            <th>요약 결과</th>
                            <th>실행일시</th>
                        </tr>
                        </thead>
                        <tbody id="detailAnalysesBody"></tbody>
                    </table>
                </div>
                <footer class="footer"></footer>
            </div>
        </main>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script th:src="@{/js/admin/user_detail.js}"></script>
</body>
</html>

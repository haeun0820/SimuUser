<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 관리 - SimuUser</title>
    <link rel="stylesheet" th:href="@{/css/admin/dashboard/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/admin/inquiry/inquiry.css}">
</head>
<body>
<div class="app-layout">
    <div class="main-area">
        <header class="top-header" style="height: 70px; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0;">
            <div>
                <div class="dashboard-title" style="font-size: 22px; font-weight: 800;">문의 관리</div>
                <div class="dashboard-sub" style="font-size: 13px; color: #64748b; margin-top: 4px;">사용자 문의 및 요청 사항 관리</div>
            </div>
            
            <form class="logout-form" th:action="@{/logout}" method="post" style="margin: 0;">
                <button class="btn-logout" type="submit">로그아웃</button>
            </form>
        </header>

        <main class="page-content" style="overflow-y: auto;">
            
            <div class="inquiry-toolbar">
                <div class="toolbar-left">
                    <button class="btn-back" onclick="history.back()">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </button>
                    <div class="search-wrapper">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <input type="text" id="inquirySearchInput" placeholder="제목 또는 작성자 검색..">
                    </div>
                </div>

                <div class="toolbar-right">
                    <label class="checkbox-label">
                        <input type="checkbox" id="filterUnread"> 미답변(안 읽은) 게시물만 보기
                    </label>
                </div>
            </div>

            <div class="inquiry-card">
                <div class="result-count">
                    검색결과 <span id="inquiryCount">3</span> 개
                </div>

                <table class="inquiry-table">
                    <thead>
                        <tr>
                            <th class="col-no">No</th>
                            <th class="col-title">제목</th>
                            <th class="col-author">작성자</th>
                            <th class="col-date">등록일시</th>
                            <th class="col-status">상태</th>
                        </tr>
                    </thead>
                    <tbody id="inquiryTableBody">
                        <tr class="inquiry-row" data-status="unread" style="cursor: pointer;" th:onclick="|location.href='@{/admin/inquiry/detail}'|">
                            <td class="col-no">3</td>
                            <td class="col-title">AI 시뮬레이션 결과가 이상하게 나옵니다. 확인 부탁드립니다.</td>
                            <td class="col-author">연주 최</td>
                            <td class="col-date">2026. 4. 12.</td>
                            <td class="col-status"><span class="status-badge status-unread">미답변</span></td>
                        </tr>
                        
                        <tr class="inquiry-row" data-status="answered" style="cursor: pointer;" th:onclick="|location.href='@{/admin/inquiry/detail}'|">
                            <td class="col-no">2</td>
                            <td class="col-title">결제 내역 영수증 발급은 어디서 하나요?</td>
                            <td class="col-author">김유저</td>
                            <td class="col-date">2026. 4. 10.</td>
                            <td class="col-status"><span class="status-badge status-answered">답변완료</span></td>
                        </tr>
                        
                        <tr class="inquiry-row" data-status="answered" style="cursor: pointer;" th:onclick="|location.href='@{/admin/inquiry/detail}'|">
                            <td class="col-no">1</td>
                            <td class="col-title">프로젝트 삭제 후 복구가 가능한지 문의드립니다.</td>
                            <td class="col-author">윤냥 나는</td>
                            <td class="col-date">2026. 4. 05.</td>
                            <td class="col-status"><span class="status-badge status-answered">답변완료</span></td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination">
                    <button class="page-btn" disabled>&lt;</button>
                    <button class="page-btn active">1</button>
                    <button class="page-btn">2</button>
                    <button class="page-btn">3</button>
                    <button class="page-btn">&gt;</button>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/admin/inquiry.js}"></script>
</body>
</html>
